<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta class="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.5.1.js"></script>

    <style>
        #keyBoard {
            background-color: green;
            width: 286px;
            height: 316px;
        }

        .keycap {
            position: relative;
            color: #000;
            /* border: 1px solid #000; */
            width: 64px;
            height: 64px;
            margin-top: 4px;
            margin-left: 4px;
        }

        .keyborder {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 64px;
            height: 64px;
            border-width: 1px;
            border-radius: 5px;
            background-color: #cccccc;
        }

        /* css注释说明： 背景为红色 */
        .keytop {
            position: absolute;

            left: 8px;
            top: 3px;
            width: 46px;
            height: 46px;
            border-style: solid;
            border-width: 1px;
            border-color: rgba(134, 129, 129, 0.1);
            background-color: #fcfcfc;
            border-radius: 3px;

        }

        /* 背景为黄色 */
        .keylabels {
            position: absolute;
            left: 8px;
            top: 3px;
            width: 40px;
            height: 40px;
            padding: 3px;
            color: #080808;
            font-size: 10px;
        }

        /* DIV背景颜色为蓝色 */


        .form_1 {
            width: 400px;
            height: 300px;
            border: 3px solid #f8f8f8;
            visibility: hidden;
            position: absolute;
            z-index: 999;
            opacity: 1;
            overflow: hidden;
            background-color: white;
            text-align: center;
            margin-top: 10%;
            margin-left: 35%;
            border-radius: 10px;
        }

        .open {
            visibility: visible;
            opacity: 1;
        }

        .input_1 {
            margin-top: 15px;
            width: 100%;
            height: 40px;

        }

        input {
            width: 280px;
            height: 30px;
            border-radius: 5px;
            border: 1px solid #e5dfdf;
        }

        .input_1 .login_logo {
            text-align: left;
            font-size: 20px;
            font-weight: 300;
            padding-left: 30px;
            float: left;
        }

        .input_1 .close {
            width: 20px;
            height: 20px;
            color: #5d5d5d;
            text-align: center;
            line-height: 20px;
            border: 1px solid #5d5d5d;
            border-radius: 50%;
            float: right;
            padding-top: 0px;
            margin-right: 10px;
            font-size: 12px;
        }

        .input_1 .close:hover {
            cursor: pointer;
        }

        hr {
            background-color: #F8F8F8;
        }

        .input_1 .submit_1 {
            border: 2px solid #f88020;
            height: 40px;
            background-color: white;
        }

        .input_1 .submit_1:hover {
            background-color: #f88020;
            color: white;
        }
    </style>
</head>
