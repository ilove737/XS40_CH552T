<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XS40_CH552T 键位映射编辑器 (Web)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <h1>XS40_CH552T 键位映射编辑器 <span class="web-tag">WebHID</span></h1>
    <span id="connStatus" class="status-badge off">未连接</span>
  </header>

  <div class="toolbar">
    <button id="btnConnect" class="primary">连接键盘</button>
    <button id="btnRefresh">刷新</button>
    <span class="sep"></span>
    <button id="btnRead">读取设备</button>
    <button id="btnWrite">写入设备</button>
    <button id="btnDefault">恢复默认</button>
    <span class="sep"></span>
    <button id="btnImport">导入文件</button>
    <button id="btnExportTxt">导出 .txt</button>
    <button id="btnExportBin">导出 .bin</button>
    <span class="sep"></span>
    <span id="handLabel" class="hand-label">? 未检测</span>
    <input type="file" id="fileInput" accept=".txt,.bin" hidden>
  </div>

  <main>
    <aside class="sidebar">
      <div class="sidebar-title">设备 / 层</div>
      <ul id="deviceTree" class="tree"></ul>
      <p class="hint" id="sideHint">点击「连接键盘」后，这里会列出已插入的 XS40 键盘（支持左右手双设备）。</p>
    </aside>
    <section class="editor">
      <div class="layer-title" id="layerTitle">mainKeyMap (主层)</div>
      <div class="grid" id="grid"></div>
      <p class="grid-hint">点击任意按键进行编辑。每个按键 2 字节：[修饰符, 键码]。</p>
    </section>
  </main>

  <div class="statusbar" id="statusbar">就绪</div>

  <!-- 编辑弹窗 -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <div class="modal-header" id="modalTitle">编辑键位</div>
      <div class="modal-body">
        <fieldset class="mod-fieldset">
          <legend>修饰符</legend>
          <div class="mod-grid" id="modGrid"></div>
        </fieldset>
        <fieldset>
          <legend>键码</legend>
          <div class="keycode-row">
            <label>十六进制</label>
            <input type="text" id="hexInput" maxlength="4" placeholder="0x00">
            <label>名称</label>
            <input type="text" id="nameInput" list="keynamelist" placeholder="KEY_A">
            <datalist id="keynamelist"></datalist>
          </div>
        </fieldset>
        <div class="capture-row">
          <button id="btnCapture" type="button">🎯 捕获按键</button>
          <span id="captureLabel" class="capture-label">点击「捕获按键」后按目标键…</span>
        </div>
        <p class="modal-hint">提示：若组合键与系统全局热键冲突，可能无法捕获到该按键。</p>
      </div>
      <div class="modal-footer">
        <button id="btnCancel" type="button">取消</button>
        <button id="btnOk" class="primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
