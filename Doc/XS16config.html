        .keycap {
            position: relative;
            color: #000;
            /* border: 1px solid #000; */
            width: 64px;
            height: 64px;
            margin-top: 4px;
            margin-left: 4px;
        }

        .keyborder {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 64px;
            height: 64px;
            border-width: 1px;
            border-radius: 5px;
            background-color: #cccccc;
        }

        /* css注释说明： 背景为红色 */
        .keytop {
            position: absolute;

            left: 8px;
            top: 3px;
            width: 46px;
            height: 46px;
            border-style: solid;
            border-width: 1px;
            border-color: rgba(134, 129, 129, 0.1);
            background-color: #fcfcfc;
            border-radius: 3px;

        }

        /* 背景为黄色 */
        .keylabels {
            position: absolute;
            left: 8px;
            top: 3px;
            width: 40px;
            height: 40px;
            padding: 3px;
            color: #080808;
            font-size: 10px;
        }

        /* DIV背景颜色为蓝色 */
    </style>
</head>

        $(".keylabels").click(function () {
            $('.keylabels').attr("style", "border-width: 0px;");

            $(this).attr("id", "kkkk");
            // $(this).text("dsf")
        })

        $(document).keydown(function (event) {
            // 拦截浏览器默认事件
            var oEvent = window.event;
            if (oEvent && oEvent.preventDefault) {
                event.preventDefault();
            } else {
                window.event.returnValue = false;
            }

            $('#kkkk').text(event.keyCode)
            console.log(event.keyCode);
        });
